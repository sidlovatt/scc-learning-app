name: Build APK and publish release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Zip web bundle for OTA
        run: cd dist && zip -r ../web-bundle.zip . && cd ..

      - name: Set release tag
        id: tag
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build ${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            web-bundle.zip

      - name: Update OTA version manifest
        run: |
          cat > ota/version.json <<EOF
          {
            "version": "${{ steps.tag.outputs.tag }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/web-bundle.zip"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ota/version.json
          git diff --staged --quiet || git commit -m "Update OTA manifest for ${{ steps.tag.outputs.tag }}"
          git push
